version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    goconst:
      min-len: 2
      min-occurrences: 2
    gosec:
      excludes:
        - G204
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    revive:
      enable-default-rules: true
      rules:
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
        path: (_test\.go|metrics/provider\.go)$
      - linters:
          - gosec
        path: _test\.go$
        text: 'G101:'
      - path: (.+)\.go$
        text: 'ST1003: method ToDb should be ToDB'
      - path: (.+)\.go$
        text: 'ST1003: method FromDb should be FromD'
      - path: (.+)\.go$
        text: 'G204: Subprocess launched with function call as argument or cmd arguments'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/mattermost/mattermost-mattermod
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
